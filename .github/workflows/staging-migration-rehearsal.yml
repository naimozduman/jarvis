name: JARVIS staging migration rehearsal

on:
  push:
    branches:
      - verify/staging-migration-workflow

permissions:
  contents: read

concurrency:
  group: jarvis-staging-migration-rehearsal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rehearse:
    if: >-
      github.repository == 'naimozduman/jarvis' &&
      github.ref == 'refs/heads/verify/staging-migration-workflow'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out this automation revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: automation
          fetch-depth: 1
          persist-credentials: false

      - name: Set up the repository-pinned pnpm and Node toolchain
        uses: pnpm/setup@00e6b8420246ccf1cdb9825b4a0e59d1ec4072ab # v2.0.0
        with:
          version: 11.23.0
          runtime: node@24.19.0
          cache: false
          install: false

      - name: Check out the fixed reviewed application revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: naimozduman/jarvis
          ref: 940ab613d71ee349ab06341dd3684dff63e25c08
          path: application
          fetch-depth: 1
          persist-credentials: false

      - name: Record the exact automation and application source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C automation rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C application rev-parse HEAD)" = '940ab613d71ee349ab06341dd3684dff63e25c08'
          test "$(git -C application rev-parse 'HEAD^{tree}')" = '5434d843f852be65af481ad297221ecd440d698f'
          test -z "$(git -C application status --porcelain)"
          test "$(sha256sum application/packages/database/drizzle/0007_nasty_spyke.sql | awk '{print $1}')" = '0187ecc1d4fa75cb36b08055fa7d8457b1452ebcb53a61e06281786b6f182d28'
          test "$(sha256sum application/packages/database/drizzle/0008_striped_dreadnoughts.sql | awk '{print $1}')" = '6f130bc05ff27fe0844acb906359e4a0cc8ecdb16a4f1734c1a72ebb5902c0ff'
          test "$(node --version)" = 'v24.19.0'
          test "$(pnpm --version)" = '11.23.0'
          printf 'automation_commit=%s\n' "$GITHUB_SHA"
          printf 'application_commit=%s\n' "$(git -C application rev-parse HEAD)"
          printf 'application_tree=%s\n' "$(git -C application rev-parse 'HEAD^{tree}')"
          sha256sum \
            automation/scripts/staging-migration-release.mjs \
            automation/scripts/staging-migration-release.test.mjs \
            automation/scripts/staging-migration-rehearsal.mjs \
            automation/.github/workflows/staging-migration-manual.yml \
            automation/.github/workflows/staging-migration-rehearsal.yml

      - name: Install the fixed application dependencies
        working-directory: application
        run: pnpm install --frozen-lockfile

      - name: Scan the automation revision for committed secrets
        working-directory: automation
        run: node scripts/check-secrets.mjs

      - name: Validate the fixed Drizzle migration package
        working-directory: application
        run: pnpm db:check

      - name: Run credential-free migration-gate safety tests
        working-directory: application
        run: node ../automation/scripts/staging-migration-release.test.mjs

      - name: Rehearse the encrypted local PostgreSQL 18 release gate
        working-directory: application
        env:
          POSTGRES_IMAGE: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        shell: bash
        run: |
          set -euo pipefail

          rehearsal_root="$(mktemp -d "$RUNNER_TEMP/jarvis-staging-migration-rehearsal.XXXXXX")"
          postgres_container="jarvis-staging-migration-rehearsal-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          cleanup() {
            docker rm --force "$postgres_container" >/dev/null 2>&1 || true
            rm -rf "$rehearsal_root"
            unset JARVIS_REHEARSAL_DATABASE_URL JARVIS_REHEARSAL_PASSWORD POSTGRES_PASSWORD
          }
          trap cleanup EXIT

          run_quietly() {
            local label="$1"
            shift
            if ! "$@" >"$rehearsal_root/${label}.log" 2>&1; then
              printf 'rehearsal: setup_failed:%s\n' "$label" >&2
              return 1
            fi
          }

          wait_for_postgres() {
            for _ in $(seq 1 30); do
              if docker exec -u postgres "$postgres_container" pg_isready -q -U postgres -d postgres >/dev/null 2>&1; then
                return 0
              fi
              sleep 1
            done
            printf 'rehearsal: setup_failed:postgres_not_ready\n' >&2
            return 1
          }

          export POSTGRES_USER=postgres
          export POSTGRES_DB=postgres
          export POSTGRES_INITDB_ARGS='--auth-host=scram-sha-256'
          export POSTGRES_PASSWORD="$(openssl rand -hex 32)"
          export JARVIS_REHEARSAL_PASSWORD="$(openssl rand -hex 32)"
          printf '::add-mask::%s\n' "$POSTGRES_PASSWORD"
          printf '::add-mask::%s\n' "$JARVIS_REHEARSAL_PASSWORD"

          mkdir -p "$rehearsal_root/tls"
          run_quietly create_test_ca openssl req -x509 -newkey rsa:2048 -nodes -days 2 \
            -keyout "$rehearsal_root/tls/ca.key" \
            -out "$rehearsal_root/tls/ca.crt" \
            -subj '/CN=jarvis-staging-migration-rehearsal-ca'
          run_quietly create_untrusted_test_ca openssl req -x509 -newkey rsa:2048 -nodes -days 2 \
            -keyout "$rehearsal_root/tls/untrusted-ca.key" \
            -out "$rehearsal_root/tls/untrusted-ca.crt" \
            -subj '/CN=jarvis-staging-migration-rehearsal-untrusted-ca'
          run_quietly create_server_request openssl req -new -newkey rsa:2048 -nodes \
            -keyout "$rehearsal_root/tls/server.key" \
            -out "$rehearsal_root/tls/server.csr" \
            -subj '/CN=localhost'
          cat >"$rehearsal_root/tls/server.ext" <<'EOF'
          basicConstraints=critical,CA:FALSE
          extendedKeyUsage=serverAuth
          keyUsage=critical,digitalSignature,keyEncipherment
          subjectAltName=DNS:localhost
          EOF
          run_quietly sign_server_certificate openssl x509 -req \
            -in "$rehearsal_root/tls/server.csr" \
            -CA "$rehearsal_root/tls/ca.crt" \
            -CAkey "$rehearsal_root/tls/ca.key" \
            -CAcreateserial \
            -out "$rehearsal_root/tls/server.crt" \
            -days 2 \
            -sha256 \
            -extfile "$rehearsal_root/tls/server.ext"

          cat >"$rehearsal_root/pg_hba.conf" <<'EOF'
          local   all             postgres                                peer
          local   all             all                                     peer
          hostssl all             all             0.0.0.0/0               scram-sha-256
          hostssl all             all             ::0/0                   scram-sha-256
          EOF
          cat >"$rehearsal_root/tls.conf" <<'EOF'
          ssl = on
          ssl_ca_file = 'ca.crt'
          ssl_cert_file = 'server.crt'
          ssl_key_file = 'server.key'
          ssl_min_protocol_version = 'TLSv1.2'
          EOF

          run_quietly pull_postgres_image docker pull "$POSTGRES_IMAGE"
          test "$POSTGRES_IMAGE" = 'postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280'
          printf 'rehearsal: postgres_image=%s\n' "$POSTGRES_IMAGE"
          run_quietly start_postgres docker run --detach --rm \
            --name "$postgres_container" \
            --publish '127.0.0.1:55432:5432' \
            --env POSTGRES_USER \
            --env POSTGRES_PASSWORD \
            --env POSTGRES_DB \
            --env POSTGRES_INITDB_ARGS \
            "$POSTGRES_IMAGE"
          wait_for_postgres

          run_quietly copy_ca docker cp "$rehearsal_root/tls/ca.crt" "$postgres_container:/var/lib/postgresql/data/ca.crt"
          run_quietly copy_server_certificate docker cp "$rehearsal_root/tls/server.crt" "$postgres_container:/var/lib/postgresql/data/server.crt"
          run_quietly copy_server_key docker cp "$rehearsal_root/tls/server.key" "$postgres_container:/var/lib/postgresql/data/server.key"
          run_quietly copy_hba docker cp "$rehearsal_root/pg_hba.conf" "$postgres_container:/var/lib/postgresql/data/pg_hba.conf"
          run_quietly copy_tls_config docker cp "$rehearsal_root/tls.conf" "$postgres_container:/tmp/jarvis-rehearsal-tls.conf"
          run_quietly secure_tls_files docker exec -u root "$postgres_container" sh -c \
            'chown postgres:postgres "$PGDATA/ca.crt" "$PGDATA/server.crt" "$PGDATA/server.key" "$PGDATA/pg_hba.conf" /tmp/jarvis-rehearsal-tls.conf && chmod 0600 "$PGDATA/server.key" && chmod 0644 "$PGDATA/ca.crt" "$PGDATA/server.crt" "$PGDATA/pg_hba.conf" /tmp/jarvis-rehearsal-tls.conf'
          run_quietly configure_tls docker exec -u postgres "$postgres_container" sh -c \
            'cat /tmp/jarvis-rehearsal-tls.conf >> "$PGDATA/postgresql.conf"'
          run_quietly restart_postgres docker restart "$postgres_container"
          wait_for_postgres

          if ! docker exec -u postgres "$postgres_container" psql -X -At -U postgres -d postgres -c 'show ssl' >"$rehearsal_root/ssl-state.log" 2>&1; then
            printf 'rehearsal: setup_failed:postgres_ssl_inspection\n' >&2
            exit 1
          fi
          if ! grep -Fxq 'on' "$rehearsal_root/ssl-state.log"; then
            printf 'rehearsal: setup_failed:postgres_ssl_not_enabled\n' >&2
            exit 1
          fi
          if ! docker exec -u postgres "$postgres_container" psql -X -At -U postgres -d postgres -c "select bool_and(type = 'hostssl') from pg_hba_file_rules where type like 'host%'" >"$rehearsal_root/hba-state.log" 2>&1; then
            printf 'rehearsal: setup_failed:postgres_hba_inspection\n' >&2
            exit 1
          fi
          if ! grep -Fxq 't' "$rehearsal_root/hba-state.log"; then
            printf 'rehearsal: setup_failed:postgres_hostssl_policy_missing\n' >&2
            exit 1
          fi
          printf 'rehearsal: postgres_tls_and_hostssl_policy=pass\n'

          export JARVIS_REHEARSAL_SQL_PATH="$rehearsal_root/create-role.sql"
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';

          const password = process.env.JARVIS_REHEARSAL_PASSWORD;
          const sqlPath = process.env.JARVIS_REHEARSAL_SQL_PATH;
          if (!/^[0-9a-f]{64}$/i.test(password ?? '') || !sqlPath) {
            process.exit(1);
          }
          writeFileSync(
            sqlPath,
            [
              "CREATE ROLE jarvis_migration_rehearsal LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT PASSWORD '" + password + "';",
              'CREATE DATABASE jarvis_migration_rehearsal OWNER jarvis_migration_rehearsal;',
              'REVOKE ALL ON DATABASE jarvis_migration_rehearsal FROM PUBLIC;',
              'GRANT CONNECT ON DATABASE jarvis_migration_rehearsal TO jarvis_migration_rehearsal;',
            ].join('\n') + '\n',
            { mode: 0o600 },
          );
          NODE
          if ! docker exec -u postgres -i "$postgres_container" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres <"$JARVIS_REHEARSAL_SQL_PATH" >"$rehearsal_root/create-role.log" 2>&1; then
            printf 'rehearsal: setup_failed:rehearsal_role_creation\n' >&2
            exit 1
          fi

          export JARVIS_REHEARSAL_CA_PATH="$rehearsal_root/tls/ca.crt"
          export JARVIS_REHEARSAL_UNTRUSTED_CA_PATH="$rehearsal_root/tls/untrusted-ca.crt"
          export JARVIS_REHEARSAL_CA_PATH_INPUT="$JARVIS_REHEARSAL_CA_PATH"
          JARVIS_REHEARSAL_DATABASE_URL="$(node --input-type=module <<'NODE'
          const password = process.env.JARVIS_REHEARSAL_PASSWORD;
          const certificateAuthorityPath = process.env.JARVIS_REHEARSAL_CA_PATH_INPUT;
          if (!password || !certificateAuthorityPath) {
            process.exit(1);
          }
          const connectionString = [
            'postgresql://jarvis_migration_rehearsal:',
            encodeURIComponent(password),
            '@localhost:55432/jarvis_migration_rehearsal?sslmode=verify-full&sslrootcert=',
            encodeURIComponent(certificateAuthorityPath),
          ].join('');
          process.stdout.write(connectionString);
          NODE
          )"
          export JARVIS_REHEARSAL_DATABASE_URL
          JARVIS_REHEARSAL_DATABASE_URL="$JARVIS_REHEARSAL_DATABASE_URL" \
            JARVIS_REHEARSAL_CA_PATH="$JARVIS_REHEARSAL_CA_PATH" \
            JARVIS_REHEARSAL_UNTRUSTED_CA_PATH="$JARVIS_REHEARSAL_UNTRUSTED_CA_PATH" \
            node ../automation/scripts/staging-migration-rehearsal.mjs
