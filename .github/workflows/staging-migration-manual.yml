name: JARVIS staging migration

on:
  workflow_dispatch:
    inputs:
      release_hold_verified:
        description: Confirm that the release coordinator has freshly verified the supported Convex hold, active leases, and in-flight work.
        required: true
        type: boolean
      recovery_point_verified:
        description: Confirm that the release coordinator has freshly verified an available Neon recovery point and its retention window.
        required: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: jarvis-staging-migration
  cancel-in-progress: false

jobs:
  migrate:
    # These acknowledgements record an owner/coordinator check. They are not an
    # independent provider verification of the live release hold or recovery point.
    if: >-
      github.repository == 'naimozduman/jarvis' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'naimozduman' &&
      inputs.release_hold_verified &&
      inputs.recovery_point_verified
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out this reviewed automation revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: automation
          fetch-depth: 1
          persist-credentials: false

      - name: Set up the repository-pinned pnpm and Node toolchain
        uses: pnpm/setup@00e6b8420246ccf1cdb9825b4a0e59d1ec4072ab # v2.0.0
        with:
          version: 11.23.0
          runtime: node@24.19.0
          cache: false
          install: false

      - name: Check out the fixed reviewed application revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: naimozduman/jarvis
          ref: 940ab613d71ee349ab06341dd3684dff63e25c08
          path: application
          fetch-depth: 1
          persist-credentials: false

      - name: Verify the fixed application source and migration pair
        working-directory: application
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '940ab613d71ee349ab06341dd3684dff63e25c08'
          test "$(git rev-parse 'HEAD^{tree}')" = '5434d843f852be65af481ad297221ecd440d698f'
          test -z "$(git status --porcelain)"
          test "$(sha256sum packages/database/drizzle/0007_nasty_spyke.sql | awk '{print $1}')" = '0187ecc1d4fa75cb36b08055fa7d8457b1452ebcb53a61e06281786b6f182d28'
          test "$(sha256sum packages/database/drizzle/0008_striped_dreadnoughts.sql | awk '{print $1}')" = '6f130bc05ff27fe0844acb906359e4a0cc8ecdb16a4f1734c1a72ebb5902c0ff'
          test "$(node --version)" = 'v24.19.0'
          test "$(pnpm --version)" = '11.23.0'
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const expected = [
            '0000_large_prima',
            '0001_foamy_blue_shield',
            '0002_great_machine_man',
            '0003_windy_kylun',
            '0004_shallow_grim_reaper',
            '0005_magenta_thor',
            '0006_massive_microchip',
            '0007_nasty_spyke',
            '0008_striped_dreadnoughts',
          ];
          const journal = JSON.parse(readFileSync('packages/database/drizzle/meta/_journal.json', 'utf8'));
          const tags = journal.entries.map((entry) => entry.tag);
          if (JSON.stringify(tags) !== JSON.stringify(expected)) {
            process.exitCode = 1;
          }
          NODE
          printf 'Fixed application source and reviewed migration pair verified.\n'

      - name: Install fixed application dependencies
        working-directory: application
        run: pnpm install --frozen-lockfile

      - name: Validate the Drizzle migration package
        working-directory: application
        run: pnpm db:check

      - name: Run synthetic workflow safety checks
        working-directory: application
        run: node ../automation/scripts/staging-migration-release.test.mjs

      - name: Apply reviewed staging migrations and verify the resulting schema
        working-directory: application
        env:
          JARVIS_MIGRATIONS_DATABASE_URL: ${{ secrets.JARVIS_STAGING_MIGRATIONS_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          node ../automation/scripts/staging-migration-release.mjs apply
